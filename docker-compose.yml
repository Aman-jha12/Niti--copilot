version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: niti_postgres
    restart: always
    environment:
      POSTGRES_USER: niti
      POSTGRES_PASSWORD: NitiPg@2026!
      POSTGRES_DB: niticopilot
    ports:
      - "5432:5432"
    volumes:
      - niti_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: niti_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  niti_pgdata:
